name: Fabrica-de-Software

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Instalar Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar Neutralino
        run: npm install -g @neutralinojs/neu

      - name: Inicializar Neutralino
        run: neu update

      - name: Compilar programa
        run: neu build --release

      - name: Subir ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: MiBingo-PC
          path: dist/**
